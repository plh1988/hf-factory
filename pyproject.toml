[project]
name = "hf-factory"
version = "0.1.0"
description = "Healthcare AI Platform Factory - Data Engine and API Engine (v1 prototype)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=16",
    "duckdb==1.5.6",          # pinned: checksums use DuckDB's hash()
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Google Cloud clients for the gcp profile (always installed in the Docker image)
gcp = [
    "google-cloud-storage>=2.16",
    "google-cloud-bigquery>=3.20",
    "google-cloud-pubsub>=2.21",
    "google-cloud-run>=0.10",
    "google-cloud-aiplatform>=1.60",
    "google-cloud-api-gateway>=1.9",
    "google-cloud-alloydb-connector[pg8000]>=1.4",
]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore::DeprecationWarning:starlette.testclient"]
