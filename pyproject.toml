[project]
name = "hf-factory"
version = "0.1.0"
description = "Healthcare AI Platform Factory - Data Engine and API Engine (v1 prototype)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyarrow>=16",
    "duckdb==1.5.6",          # pinned: checksums use DuckDB's hash()
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore::DeprecationWarning:starlette.testclient"]
